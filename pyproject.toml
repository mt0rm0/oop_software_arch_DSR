[project]
name = "oop-software-arch-dsr"
version = "0.1.0"
description = "OOP and Software Architecture for Data Scientists — Data Science Retreat"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core DS stack
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    # Notebook runtime (needed for VS Code Jupyter extension)
    "ipykernel>=6.29",
    "jupyter>=1.1",
    # Config validation (notebook 05)
    "pydantic>=2.6",
    # Logging (notebook 09)
    "loguru>=0.7",
    # Data versioning (notebook 13) — optional but pre-installed for convenience
    "dvc>=3.49",
    # Experiment tracking (notebook 13)
    "mlflow>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",       # linter + formatter
    "mypy>=1.9",       # type checker
    "pandas-stubs>=2", # type stubs for pandas
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

# ── Ruff (linter + formatter, replaces flake8/black/isort) ──────────────────

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # function calls in default args (common in dataclasses)
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "F811"]  # notebooks have loose imports

# ── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_return_any = false

